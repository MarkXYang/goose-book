# Fly.io deployment manifest for the Programming in Goose remote runner.
# Deploy from playground-server/ with:
#   fly launch --copy-config --no-deploy
#   fly deploy

app = "goose-book-playground"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  MAX_CONCURRENT = "4"
  RATE_LIMIT_PER_MIN = "30"
  RUN_TIMEOUT_SEC = "6"
  BUILD_TIMEOUT_SEC = "20"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
