# Render.com Blueprint for one-click deployment of the Goose Playground Runner.
services:
  - type: web
    name: goose-book-playground
    runtime: docker
    rootDir: playground-server
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: PORT
        value: "8080"
      - key: MAX_CONCURRENT
        value: "4"
      - key: RATE_LIMIT_PER_MIN
        value: "30"
      - key: RUN_TIMEOUT_SEC
        value: "6"
      - key: BUILD_TIMEOUT_SEC
        value: "20"
