name: Deploy Programming in Goose to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.5.4"

      - name: Configure remote Goose playground URL (if set)
        env:
          GOOSE_PLAYGROUND_URL: ${{ vars.GOOSE_PLAYGROUND_URL }}
        run: |
          if [ -n "$GOOSE_PLAYGROUND_URL" ]; then
            printf 'window.GOOSE_PLAYGROUND_URL = %s;\n' "$(python3 -c 'import json, os; print(json.dumps(os.environ["GOOSE_PLAYGROUND_URL"]))')" > theme/goose-config.js
          fi

      - name: Build mdBook (EN + ZH)
        run: |
          mdbook build
          mdbook build zh

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
