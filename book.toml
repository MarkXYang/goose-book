[book]
title = "Programming in Goose"
description = "Memory-Safe Systems Programming Without a Heap"
authors = ["Mark Yang"]
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/MarkXYang/goose-book"
edit-url-template = "https://github.com/MarkXYang/goose-book/edit/main/{path}"
additional-css = ["theme/custom.css"]
additional-js = [
    "theme/goose-highlight.js",
    "theme/goose-config.js",
    "theme/goose-precomputed.js",
    "theme/goose-playground.js",
    "theme/lang-switch.js",
]

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
